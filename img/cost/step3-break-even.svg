<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">100 元買 1 張，要賣多少才不虧？</title>
  <desc id="chart-desc">數線由左至右價格升高，原價 100 元賣出會虧 584 元，掛 100.5 元還虧 86 元。理論不虧價是 100.587 元，但因每檔跳 0.5 元，實際要掛 101 元，可賺 412 元。</desc>
  <style>
    svg {
      font-family: -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
      font-size: 12px;
      --text: #1c2330;
      --secondary: #6b7482;
      --primary: #2563eb;
      --danger: #b91c1c;
      --neutral: #9aa3b2;
      --emphasis: #b45309;
      --line: #c9ced6;
      --safe: #15803d;
    }
    .text { fill: var(--text); }
    .secondary { fill: var(--secondary); }
    .danger { fill: var(--danger); }
    .safe { fill: var(--safe); }
    .emphasis { fill: var(--emphasis); }
    .title { fill: var(--text); font-size: 16px; font-weight: 700; }
    .label { font-size: 13px; }
    .bold { font-weight: 700; }
    .axis { fill: none; stroke: var(--line); stroke-width: 1; }
    .arrow { fill: var(--line); }
    .loss-band { stroke: var(--danger); stroke-width: 8; opacity: 0.18; }
    .gain-band { stroke: var(--safe); stroke-width: 8; opacity: 0.18; }
    .neutral-point { fill: var(--neutral); }
    .danger-point { fill: var(--danger); }
    .safe-point { fill: var(--safe); stroke: var(--safe); stroke-width: 2; }
    .theory-point { fill: none; stroke: var(--emphasis); stroke-width: 2; }
    .theory-guide { fill: none; stroke: var(--emphasis); stroke-width: 1.5; stroke-dasharray: 4 3; }
    .danger-guide { fill: none; stroke: var(--danger); stroke-width: 1; opacity: 0.6; }
    .note-box { fill: var(--primary); fill-opacity: 0.045; stroke: var(--line); }
    @media (prefers-color-scheme: dark) {
      svg {
        --text: #e8ebf0;
        --secondary: #9aa3b2;
        --primary: #6ea0ff;
        --danger: #f87171;
        --neutral: #6b7482;
        --emphasis: #fbbf24;
        --line: #3a4250;
        --safe: #4ade80;
      }
    }
  </style>

  <text class="title" x="16" y="27">100 元買 1 張，要賣多少才不虧？</text>
  <text class="secondary" x="16" y="49">損益兩平價：賣在多少才不虧。</text>

  <text class="emphasis label bold" x="146.096" y="78" text-anchor="middle">理論不虧 100.587</text>
  <path class="theory-guide" d="M146.096 86V164"/>

  <text class="text label" x="24" y="112">100 元</text>
  <text class="secondary" x="24" y="132">買入價</text>

  <text class="safe label bold" x="232" y="112" text-anchor="middle">實際掛 101</text>
  <text class="safe" x="232" y="132" text-anchor="middle">賺 412 元</text>

  <path class="loss-band" d="M24 152H146.096"/>
  <path class="gain-band" d="M146.096 152H336"/>
  <path class="axis" d="M24 152H336"/>
  <path class="arrow" d="M334 148L341 152L334 156Z"/>

  <path class="danger-guide" d="M128 158V193"/>

  <circle class="neutral-point" cx="24" cy="152" r="4.5"/>
  <circle class="danger-point" cx="128" cy="152" r="4.5"/>
  <circle class="theory-point" cx="146.096" cy="152" r="4"/>
  <circle class="safe-point" cx="232" cy="152" r="6"/>

  <text class="danger" x="16" y="178">原價賣：虧 584 元</text>
  <text class="secondary" x="336" y="178" text-anchor="end">101.5 元</text>

  <text class="danger label" x="128" y="207" text-anchor="middle">掛 100.5</text>
  <text class="danger" x="128" y="225" text-anchor="middle">還虧 86 元</text>
  <text class="secondary" x="336" y="207" text-anchor="end">往右價格越高</text>

  <rect class="note-box" x="16" y="239" width="328" height="51" rx="7"/>
  <text class="text" x="26" y="259">
    <tspan x="26" y="259">100–500 元的股票每檔跳 0.5 元，</tspan>
    <tspan x="26" y="279">100.587 掛不出去，要往上取到 101。</tspan>
  </text>

  <text class="secondary" x="16" y="311">手續費 0.1425%、不打折、最低 20 元；股票證交稅 0.3%。</text>
</svg>