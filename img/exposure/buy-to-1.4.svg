<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" role="img" aria-labelledby="title desc">
  <title id="title">用現金買正二，為什麼大盤曝險倍數會增加？</title>
  <desc id="desc">拿 130 萬現金買正二前後，股票都是 1,000 萬、總資產都是 1,200 萬，扣除借款 300 萬，淨資產都是 900 萬。正二 1 元約等於 2 元大盤，因此曝險從 1,000 萬增加到 1,260 萬，倍數從 1.11 倍增加到 1.4 倍。</desc>

  <style>
    text {
      font-family: -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
      font-size: 12px;
      fill: #1c2330;
      text-anchor: middle;
      font-variant-numeric: tabular-nums;
    }
    .text { fill: #1c2330; }
    .muted { fill: #6b7482; }
    .primary { fill: #2563eb; }
    .danger { fill: #b91c1c; }
    .neutral { fill: #9aa3b2; }
    .accent { fill: #b45309; }
    .safe { fill: #15803d; }
    .line { fill: none; stroke: #c9ced6; stroke-width: 1; }
    .arrow { fill: none; stroke: #2563eb; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .cash { fill: none; stroke: #15803d; stroke-width: 1.3; }
    .debt { fill: none; stroke: #b91c1c; stroke-width: 1.3; }
    .on-primary { fill: #e8ebf0; }
    .formula { font-size: 13px; font-weight: 600; }
    .heading { font-size: 15px; font-weight: 700; }
    .result { font-size: 16px; font-weight: 700; }
    .bold { font-weight: 700; }
    .closing { letter-spacing: -0.35px; }

    @media (prefers-color-scheme: dark) {
      text, .text { fill: #e8ebf0; }
      .muted { fill: #9aa3b2; }
      .primary { fill: #6ea0ff; }
      .danger { fill: #f87171; }
      .neutral { fill: #6b7482; }
      .accent { fill: #fbbf24; }
      .safe { fill: #4ade80; }
      .line { stroke: #3a4250; }
      .arrow { stroke: #6ea0ff; }
      .cash { stroke: #4ade80; }
      .debt { stroke: #f87171; }
      .on-primary { fill: #1c2330; }
    }
  </style>

  <text x="180" y="23" class="formula">曝險倍數 ＝ 曝險金額 ÷ 淨資產（總資產 − 借款）</text>
  <text x="180" y="46" class="primary bold">正二 1 元約等於 2 元大盤</text>
  <text x="180" y="65" class="muted">用現金買正二：曝險增加，淨資產不變。</text>

  <text x="88" y="94" class="heading">買正二之前</text>
  <path d="M148 88 H210 M204 83 L210 88 L204 93" class="arrow"/>
  <text x="272" y="94" class="heading">買正二之後</text>
  <text x="180" y="115" class="primary bold">拿 130 萬現金買正二</text>

  <path d="M180 127 V510" class="line"/>

  <!-- 所有長條共用比例尺：每萬 0.2 單位，底線皆為 420。 -->
  <g aria-label="買正二之前">
    <text x="43" y="135" class="heading">我的錢</text>
    <text x="43" y="150" class="muted">總資產</text>
    <text x="43" y="165" class="bold">1,200 萬</text>

    <text x="139" y="135" class="heading">曝險</text>
    <text x="139" y="150" class="muted">等於大盤</text>
    <text x="139" y="165" class="bold">1,000 萬</text>

    <rect x="16" y="220" width="54" height="200" class="neutral"/>
    <rect x="16" y="180" width="54" height="40" class="cash"/>
    <text x="43" y="196" class="safe">現金</text>
    <text x="43" y="213" class="safe">200 萬</text>
    <text x="43" y="301">股票</text>
    <text x="43" y="320" class="bold">1,000 萬</text>

    <path d="M73 360 H78 V420 H73" class="debt"/>
    <text x="93" y="374" class="danger">借款</text>
    <text x="93" y="390" class="danger bold">300</text>
    <text x="93" y="406" class="danger">萬</text>

    <rect x="112" y="220" width="54" height="200" class="neutral"/>
    <text x="139" y="278">股票</text>
    <text x="139" y="297" class="bold">1,000 萬</text>
    <text x="139" y="316">×1</text>
    <text x="139" y="339">＝1,000</text>
    <text x="139" y="357">萬</text>

    <path d="M12 420 H170" class="line"/>
    <text x="43" y="444" class="safe">淨資產</text>
    <text x="43" y="462" class="safe bold">900 萬</text>
    <text x="139" y="444" class="muted">曝險金額</text>
    <text x="139" y="462" class="bold">1,000 萬</text>

    <text x="88" y="485" class="muted">曝險 ÷ 淨資產</text>
    <text x="88" y="506" class="result">1,000 ÷ 900 ≈ 1.11 倍</text>
  </g>

  <g aria-label="買正二之後">
    <text x="221" y="135" class="heading">我的錢</text>
    <text x="221" y="150" class="muted">總資產</text>
    <text x="221" y="165" class="bold">1,200 萬</text>

    <text x="317" y="135" class="heading">曝險</text>
    <text x="317" y="150" class="muted">等於大盤</text>
    <text x="317" y="165" class="bold">1,260 萬</text>

    <rect x="194" y="220" width="54" height="200" class="neutral"/>
    <rect x="194" y="194" width="54" height="26" class="primary"/>
    <rect x="194" y="180" width="54" height="14" class="cash"/>
    <text x="221" y="191" class="safe">70 萬</text>
    <path d="M248 187 H256" class="cash"/>
    <text x="271" y="191" class="safe">現金</text>
    <text x="221" y="205" class="on-primary">正二</text>
    <text x="221" y="218" class="on-primary">130 萬</text>
    <text x="221" y="301">股票</text>
    <text x="221" y="320" class="bold">1,000 萬</text>

    <path d="M251 360 H256 V420 H251" class="debt"/>
    <text x="271" y="374" class="danger">借款</text>
    <text x="271" y="390" class="danger bold">300</text>
    <text x="271" y="406" class="danger">萬</text>

    <rect x="290" y="220" width="54" height="200" class="neutral"/>
    <rect x="290" y="168" width="54" height="52" class="primary"/>
    <text x="317" y="182" class="on-primary">正二</text>
    <text x="317" y="198" class="on-primary bold">130 萬</text>
    <text x="317" y="214" class="on-primary bold">×2</text>
    <text x="317" y="243">＋</text>
    <text x="317" y="278">股票</text>
    <text x="317" y="297" class="bold">1,000 萬</text>
    <text x="317" y="316">×1</text>
    <text x="317" y="339">＝1,000</text>
    <text x="317" y="357">萬</text>

    <path d="M190 420 H348" class="line"/>
    <text x="221" y="444" class="safe">淨資產</text>
    <text x="221" y="462" class="safe bold">900 萬</text>
    <text x="317" y="444" class="muted">曝險金額</text>
    <text x="317" y="462" class="primary bold">1,260 萬</text>

    <text x="272" y="485" class="muted">曝險 ÷ 淨資產</text>
    <text x="272" y="506" class="result primary">1,260 ÷ 900 ＝ 1.4 倍</text>
  </g>

  <path d="M12 518 H348" class="line"/>
  <text x="180" y="534" class="muted">四根長條使用同一比例尺</text>
  <text x="180" y="553" class="accent closing">總資產沒變，倍數從 1.11 變 1.4：多出來的曝險來自正二的 2 倍。</text>
</svg>