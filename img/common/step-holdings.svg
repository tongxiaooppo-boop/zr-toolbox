<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 390" role="img" aria-labelledby="title desc">
  <title id="title">步驟 1：你拿去質押的股票</title>
  <desc id="desc">從券商 App 的庫存畫面找到股票代號、股數與成本均價，分別填入 0050、10000 與 80。現價會自動抓取，不用填；各家 App 的欄位名稱可能不同。</desc>
  <style>
    svg {
      font-family: -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
    }
    .text { fill: #1c2330; }
    .secondary { fill: #6b7482; }
    .primary { fill: #2563eb; }
    .danger { fill: #b91c1c; }
    .neutral { fill: #9aa3b2; }
    .accent { fill: #b45309; }
    .safe { fill: #15803d; }
    .outline {
      fill: none;
      stroke: #c9ced6;
      stroke-width: 1.5;
    }
    .grid {
      fill: none;
      stroke: #c9ced6;
      stroke-width: 1;
    }
    .connector {
      fill: none;
      stroke: #2563eb;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .secondary-connector {
      fill: none;
      stroke: #6b7482;
      stroke-width: 1.2;
      stroke-linecap: round;
    }
    .heading { font-size: 16px; font-weight: 700; }
    .app-title { font-size: 15px; font-weight: 600; }
    .small { font-size: 12px; }
    .label { font-size: 13px; }
    .strong { font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .text { fill: #e8ebf0; }
      .secondary { fill: #9aa3b2; }
      .primary { fill: #6ea0ff; }
      .danger { fill: #f87171; }
      .neutral { fill: #6b7482; }
      .accent { fill: #fbbf24; }
      .safe { fill: #4ade80; }
      .outline, .grid { stroke: #3a4250; }
      .connector { stroke: #6ea0ff; }
      .secondary-connector { stroke: #9aa3b2; }
    }
  </style>
  <defs>
    <marker id="primary-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path class="primary" d="M0 0 8 4 0 8Z"/>
    </marker>
    <marker id="secondary-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path class="secondary" d="M0 0 8 4 0 8Z"/>
    </marker>
  </defs>

  <text class="text heading" x="14" y="23">步驟 1｜你拿去質押的股票</text>

  <rect class="outline" x="12" y="37" width="336" height="169" rx="21"/>
  <rect class="neutral" x="164" y="46" width="32" height="3" rx="1.5"/>
  <text class="text app-title" x="26" y="76">庫存（示意）</text>

  <text class="secondary small" x="185" y="76">現價會自動抓，不用填</text>
  <path class="secondary-connector" d="M303 81V92" marker-end="url(#secondary-arrow)"/>

  <rect class="neutral" x="24" y="94" width="312" height="26" opacity="0.1"/>
  <rect class="grid" x="24" y="94" width="312" height="59" rx="3"/>
  <path class="grid" d="M24 120H336 M142 94V153 M204 94V153 M270 94V153"/>

  <g class="secondary small" text-anchor="middle">
    <text x="83" y="112">代號／名稱</text>
    <text x="173" y="112">股數</text>
    <text x="237" y="112">成本均價</text>
    <text x="303" y="112">現價</text>
  </g>

  <text class="text small" x="29" y="140"><tspan class="strong">0050</tspan> 元大台灣50</text>
  <text class="text small strong" x="173" y="140" text-anchor="middle">10,000</text>
  <text class="text small strong" x="237" y="140" text-anchor="middle">80.00</text>
  <text class="secondary small" x="303" y="140" text-anchor="middle">100.00</text>

  <g aria-hidden="true">
    <path class="connector" d="M36 220V161Q36 157 40 157H44V148" marker-end="url(#primary-arrow)"/>
    <circle class="primary" cx="36" cy="220" r="2.3"/>

    <path class="connector" d="M315 273H329Q333 273 333 269V229Q333 225 329 225H177Q173 225 173 221V148" marker-end="url(#primary-arrow)"/>
    <circle class="primary" cx="315" cy="273" r="2.3"/>

    <path class="connector" d="M180 313H342Q346 313 346 309V220Q346 216 342 216H241Q237 216 237 212V148" marker-end="url(#primary-arrow)"/>
    <circle class="primary" cx="180" cy="313" r="2.3"/>
  </g>

  <text class="text label" x="24" y="239"><tspan class="primary strong">①</tspan> 股票代號 → 填 <tspan class="primary strong">0050</tspan></text>
  <text class="text label" x="24" y="278"><tspan class="primary strong">②</tspan> 買入股數 → 填 <tspan class="primary strong">10000</tspan>（1 張＝1000 股）</text>
  <text class="text label" x="24" y="318"><tspan class="primary strong">③</tspan> 買入價 → 填 <tspan class="primary strong">80</tspan></text>

  <text class="secondary small" x="14" y="355">
    <tspan x="14" dy="0">各家 App 欄位名稱可能不同：股數也叫</tspan>
    <tspan x="14" dy="19">「庫存股數」，成本均價也叫「平均成本」。</tspan>
  </text>
</svg>