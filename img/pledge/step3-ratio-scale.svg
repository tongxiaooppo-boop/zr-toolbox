<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 448" role="img" aria-labelledby="title desc">
  <title id="title">步驟 3：契約上的追繳規則</title>
  <desc id="desc">維持率由上往下遞減，標示現在 200%、補回目標 160%、追繳線 130%，以及擔保品剛好等於借款的 100%。右下角說明認列成數，實際追繳規則以你的契約為準。</desc>

  <style>
    text {
      font-family: -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
    }
    .text { fill: #1c2330; }
    .secondary { fill: #6b7482; }
    .primary { fill: #2563eb; }
    .danger { fill: #b91c1c; }
    .accent { fill: #b45309; }
    .safe { fill: #15803d; }
    .neutral { stroke: #9aa3b2; }
    .line { stroke: #c9ced6; }
    .outline { fill: none; stroke-width: 1.5; }
    .box { fill: none; stroke-width: 1; }
    .tint { fill-opacity: 0.14; }
    .heading { font-size: 16px; font-weight: 600; }
    .number { font-size: 18px; font-weight: 700; }
    .label { font-size: 14px; font-weight: 600; }
    .detail { font-size: 13px; }
    .small { font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .text { fill: #e8ebf0; }
      .secondary { fill: #9aa3b2; }
      .primary { fill: #6ea0ff; }
      .danger { fill: #f87171; }
      .accent { fill: #fbbf24; }
      .safe { fill: #4ade80; }
      .neutral { stroke: #6b7482; }
      .line { stroke: #3a4250; }
    }
  </style>

  <defs>
    <clipPath id="scale-clip">
      <rect x="28" y="78" width="20" height="244" rx="10"/>
    </clipPath>
  </defs>

  <text x="20" y="30" class="text heading">步驟 3｜契約上的追繳規則</text>
  <text x="20" y="62" class="secondary small">維持率</text>

  <g clip-path="url(#scale-clip)">
    <rect x="28" y="78" width="20" height="100" class="safe tint"/>
    <rect x="28" y="178" width="20" height="66" class="accent tint"/>
    <rect x="28" y="244" width="20" height="78" class="danger tint"/>
  </g>
  <rect x="28" y="78" width="20" height="244" rx="10" class="neutral outline"/>

  <g class="safe">
    <rect x="38" y="89" width="24" height="2"/>
    <circle cx="38" cy="90" r="4"/>
    <text x="76" y="96" class="number">200%</text>
    <text x="136" y="96" class="label">現在（範例）</text>
  </g>

  <g class="primary">
    <rect x="38" y="177" width="24" height="2"/>
    <circle cx="38" cy="178" r="4"/>
    <text x="76" y="184" class="number">160%</text>
    <text x="136" y="184" class="label">補回目標：</text>
  </g>
  <text x="136" y="207" class="text detail">被追繳後要補回到這裡</text>

  <g class="accent">
    <rect x="38" y="243" width="24" height="2"/>
    <circle cx="38" cy="244" r="4"/>
    <text x="76" y="250" class="number">130%</text>
    <text x="136" y="250" class="label">追繳線：</text>
  </g>
  <text x="136" y="273" class="text detail">低於這裡會被通知補錢</text>

  <g class="danger">
    <rect x="38" y="309" width="24" height="2"/>
    <circle cx="38" cy="310" r="4"/>
    <text x="76" y="316" class="number">100%</text>
    <text x="136" y="316" class="detail">擔保品剛好等於借款</text>
  </g>

  <rect x="64" y="345" width="276" height="63" rx="8" class="line box"/>
  <text x="76" y="366" class="text label">認列成數</text>
  <text x="76" y="390" class="text small">股票 100 萬 × 認列 100％ ＝ 算 100 萬</text>

  <text x="20" y="432" class="secondary small">130%、160% 是常見數字，以你的契約為準。</text>
</svg>