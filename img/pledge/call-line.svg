<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 546" role="img" aria-labelledby="chart-title chart-desc" class="graphic ink">
  <title id="chart-title">質押壓力測試：股價下跌與兩種補繳方式</title>
  <desc id="chart-desc">以質押 1 萬股、借 50 萬為例，股價從 100 元跌至 65 元及 60 元，維持率由 200% 降到追繳線 130% 及被追繳的 120%。跌 40% 後要補回 160%，可拿現金還款 12.5 萬，或補擔保品 20 萬。</desc>
  <style>
    .graphic {
      font-family: -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
      font-size: 12px;
    }
    .ink { fill: #1c2330; }
    .secondary { fill: #6b7482; }
    .primary { fill: #2563eb; }
    .danger { fill: #b91c1c; }
    .neutral { fill: #9aa3b2; }
    .accent { fill: #b45309; }
    .safe { fill: #15803d; }
    .rule { stroke: #c9ced6; stroke-width: 1; }
    .loan {
      stroke: #9aa3b2;
      stroke-width: 1.5;
      stroke-dasharray: 4 3;
    }
    .bar { fill-opacity: 0.12; stroke-width: 1.5; }
    .bar.safe { stroke: #15803d; }
    .bar.accent { stroke: #b45309; }
    .bar.danger { stroke: #b91c1c; }
    .card { fill: none; stroke: #c9ced6; stroke-width: 1; }
    .heading { font-size: 16px; font-weight: 700; }
    .section-heading { font-size: 15px; font-weight: 700; }
    .stage { font-size: 15px; font-weight: 700; }
    .ratio { font-size: 14px; font-weight: 700; }
    .status { font-size: 12px; font-weight: 700; }
    .price { font-size: 13px; }
    .card-heading { font-size: 15px; font-weight: 700; }
    .amount { font-size: 19px; font-weight: 700; }
    .balance { font-size: 14px; }
    .equation { font-size: 12px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e8ebf0; }
      .secondary { fill: #9aa3b2; }
      .primary { fill: #6ea0ff; }
      .danger { fill: #f87171; }
      .neutral { fill: #6b7482; }
      .accent { fill: #fbbf24; }
      .safe { fill: #4ade80; }
      .rule { stroke: #3a4250; }
      .loan { stroke: #6b7482; }
      .bar.safe { stroke: #4ade80; }
      .bar.accent { stroke: #fbbf24; }
      .bar.danger { stroke: #f87171; }
      .card { stroke: #3a4250; }
    }
  </style>

  <text x="180" y="29" text-anchor="middle" class="heading">維持率 ＝ 擔保品市值 ÷ 借款</text>
  <line x1="16" y1="45" x2="344" y2="45" class="rule"/>

  <g text-anchor="middle">
    <text x="64" y="68" class="stage">現在</text>
    <text x="180" y="68" class="stage">跌 35%</text>
    <text x="296" y="68" class="stage">跌 40%</text>
    <text x="180" y="87" class="status accent">追繳線</text>
    <text x="296" y="87" class="status danger">被追繳</text>

    <text x="64" y="112" class="ratio safe">維持率 200%</text>
    <text x="180" y="154" class="ratio accent">維持率 130%</text>
    <text x="296" y="160" class="ratio danger">維持率 120%</text>

    <rect x="24" y="122" width="80" height="120" class="bar safe"/>
    <rect x="140" y="164" width="80" height="78" class="bar accent"/>
    <rect x="256" y="170" width="80" height="72" class="bar danger"/>

    <line x1="16" y1="182" x2="112" y2="182" class="loan"/>
    <line x1="132" y1="182" x2="228" y2="182" class="loan"/>
    <line x1="248" y1="182" x2="344" y2="182" class="loan"/>

    <text x="64" y="199" class="secondary">借款 50 萬</text>
    <text x="180" y="199" class="secondary">借款 50 萬</text>
    <text x="296" y="199" class="secondary">借款 50 萬</text>

    <text x="64" y="229">擔保品 100 萬</text>
    <text x="180" y="229">擔保品 65 萬</text>
    <text x="296" y="229">擔保品 60 萬</text>

    <line x1="16" y1="242" x2="344" y2="242" class="rule"/>
    <text x="64" y="264" class="price">股價 100 元</text>
    <text x="180" y="264" class="price">股價 65 元</text>
    <text x="296" y="264" class="price">股價 60 元</text>
    <text x="180" y="286" class="secondary">質押 1 萬股、借 50 萬</text>
  </g>

  <text x="180" y="315" text-anchor="middle" class="section-heading">跌 40% 後，補回 160% 有兩種做法</text>

  <rect x="16" y="332" width="158" height="147" rx="10" class="card"/>
  <rect x="186" y="332" width="158" height="147" rx="10" class="card"/>

  <g text-anchor="middle">
    <text x="95" y="357" class="card-heading">拿現金還款</text>
    <text x="95" y="386" class="amount primary">還 12.5 萬</text>
    <text x="95" y="404" class="neutral">↓</text>
    <text x="95" y="425" class="balance">借款剩 37.5 萬</text>
    <text x="95" y="444" class="neutral">↓</text>
    <text x="95" y="464" class="equation primary">60 萬 ÷ 37.5 萬 ＝ 160%</text>

    <text x="265" y="357" class="card-heading">補擔保品</text>
    <text x="265" y="386" class="amount primary">補 20 萬</text>
    <text x="265" y="404" class="neutral">↓</text>
    <text x="265" y="425" class="balance">擔保品 80 萬</text>
    <text x="265" y="444" class="neutral">↓</text>
    <text x="265" y="464" class="equation primary">80 萬 ÷ 50 萬 ＝ 160%</text>
  </g>

  <text x="16" y="507" class="accent">
    <tspan x="16" y="507">同樣補回 160%，還款要的錢比補擔保少。</tspan>
    <tspan x="16" y="528">追繳線 130% 是多數券商契約，以你的契約為準。</tspan>
  </text>
</svg>