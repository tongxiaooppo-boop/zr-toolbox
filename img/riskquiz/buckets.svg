<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 304" role="img" aria-labelledby="title desc">
  <title id="title">先留保守，再分三桶</title>
  <desc id="desc">先留保守（先留）：定存、貨幣市場基金，不算在三桶裡。剩下的錢分三桶，穩健：債券 ETF、股債配置、00713。成長：0050、0056、S&amp;P 500。積極：主動式 ETF、正2、個股。積極型 20／30／50，穩健型 50／30／20，示意主力桶占一半。</desc>
  <style>
    text { font-family: system-ui, sans-serif; text-anchor: middle; fill: #202020; font-size: 14px; }
    .heading { font-size: 16px; font-weight: 700; }
    .reserve { fill: #e4e4e4; stroke: #8a8a8a; stroke-width: 1.5; } .safe { fill: #1f3a68; } .growth { fill: #f2b134; } .bold { fill: #c0392b; }
    .light { fill: #fff; } .ink { fill: #202020; }
    .bucket { stroke: #202020; stroke-width: 2; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f1f1f1; } .bucket { stroke: #ededed; }
      .reserve { fill: #2a3342; stroke: #7d8696; } .safe { fill: #7294c8; } .growth { fill: #f7c85e; } .bold { fill: #e58679; }
      .light, .ink { fill: #17202e; }
    }
  </style>
  <rect class="reserve" x="8" y="8" width="344" height="32" rx="6"/>
  <text x="180" y="29">先留：保守（先留）｜定存、貨幣市場基金</text>
  <g transform="translate(0 44)">
  <text class="heading" x="180" y="24">剩下的錢分三桶</text>
  <path class="bucket safe" d="M8 46 H116 L106 172 H18 Z"/>
  <path class="bucket growth" d="M126 46 H234 L224 172 H136 Z"/>
  <path class="bucket bold" d="M244 46 H352 L342 172 H254 Z"/>
  <g class="heading">
    <text class="light heading" x="62" y="71">穩健</text>
    <text class="ink heading" x="180" y="71">成長</text>
    <text class="light heading" x="298" y="71">積極</text>
  </g>
  <text class="light" x="62" y="105">債券 ETF</text>
  <text class="light" x="62" y="128">股債配置</text>
  <text class="light" x="62" y="151">00713</text>
  <text class="ink" x="180" y="105">0050</text>
  <text class="ink" x="180" y="128">0056</text>
  <text class="ink" x="180" y="151">S&amp;P 500</text>
  <text class="light" x="298" y="105">主動式 ETF</text>
  <text class="light" x="298" y="128">正2</text>
  <text class="light" x="298" y="151">個股</text>
  <text x="180" y="200">積極型 20／30／50</text>
  <text x="180" y="224">穩健型 50／30／20</text>
  <text x="180" y="248">示意主力桶占一半</text>
  </g>
</svg>
